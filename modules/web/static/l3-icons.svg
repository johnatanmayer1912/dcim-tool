<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <!-- Router Icon -->
  <symbol id="icon-router" viewBox="0 0 64 64">
    <rect x="4" y="16" width="56" height="32" rx="4" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
    <circle cx="12" cy="32" r="4" fill="#60a5fa"/>
    <circle cx="24" cy="32" r="4" fill="#60a5fa"/>
    <circle cx="36" cy="32" r="4" fill="#60a5fa"/>
    <circle cx="48" cy="32" r="4" fill="#60a5fa"/>
    <rect x="28" y="48" width="8" height="8" fill="#1e40af"/>
  </symbol>
  
  <!-- Switch Icon -->
  <symbol id="icon-switch" viewBox="0 0 64 64">
    <rect x="4" y="12" width="56" height="40" rx="4" fill="#10b981" stroke="#047857" stroke-width="2"/>
    <rect x="8" y="20" width="48" height="4" rx="2" fill="#34d399"/>
    <rect x="8" y="28" width="48" height="4" rx="2" fill="#34d399"/>
    <rect x="8" y="36" width="48" height="4" rx="2" fill="#34d399"/>
    <rect x="8" y="44" width="48" height="4" rx="2" fill="#34d399"/>
  </symbol>
  
  <!-- Gateway Icon -->
  <symbol id="icon-gateway" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="20" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <path d="M32 16 L32 48 M16 32 L48 32 M20 20 L44 44 M20 44 L44 20" stroke="#b45309" stroke-width="2"/>
    <circle cx="32" cy="32" r="8" fill="#fbbf24"/>
  </symbol>
  
  <!-- Default Gateway Icon -->
  <symbol id="icon-default-gateway" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="20" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <path d="M32 16 L32 48 M16 32 L48 32 M20 20 L44 44 M20 44 L44 20" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="32" cy="32" r="8" fill="#fca5a5"/>
    <text x="32" y="36" text-anchor="middle" font-size="10" fill="#7f1d1d" font-weight="bold">GW</text>
  </symbol>
  
  <!-- Subnet Icon -->
  <symbol id="icon-subnet" viewBox="0 0 64 64">
    <rect x="8" y="8" width="48" height="48" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
    <text x="32" y="38" text-anchor="middle" font-size="14" fill="#c4b5fd" font-weight="bold">/24</text>
  </symbol>
  
  <!-- Cisco Icon -->
  <symbol id="icon-cisco" viewBox="0 0 64 64">
    <rect x="4" y="16" width="56" height="32" rx="4" fill="#00bceb" stroke="#0085a3" stroke-width="2"/>
    <text x="32" y="38" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">CISCO</text>
  </symbol>
  
  <!-- Juniper Icon -->
  <symbol id="icon-juniper" viewBox="0 0 64 64">
    <rect x="4" y="16" width="56" height="32" rx="4" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <text x="32" y="38" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">JUNIPER</text>
  </symbol>
  
  <!-- Arista Icon -->
  <symbol id="icon-arista" viewBox="0 0 64 64">
    <rect x="4" y="16" width="56" height="32" rx="4" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
    <text x="32" y="38" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="bold">ARISTA</text>
  </symbol>
  
  <!-- Firewall Icon -->
  <symbol id="icon-firewall" viewBox="0 0 64 64">
    <rect x="4" y="8" width="56" height="48" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <rect x="8" y="16" width="48" height="4" fill="#fca5a5"/>
    <rect x="8" y="24" width="48" height="4" fill="#fca5a5"/>
    <rect x="8" y="32" width="48" height="4" fill="#fca5a5"/>
    <rect x="8" y="40" width="48" height="4" fill="#fca5a5"/>
    <path d="M28 48 L36 48 L32 56 Z" fill="#fca5a5"/>
  </symbol>
</svg>
