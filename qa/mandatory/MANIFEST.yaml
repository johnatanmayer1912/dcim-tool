# NLAP Mandatory QA Manifest — always keep in sync with tests/mandatory/
# Council skill: .cursor/skills/nlap-release-council/
# Policy: qa/mandatory/EVOLUTION_POLICY.md

version: 1
platform: Network Log Analysis Platform
last_updated: "2026-08-02"
introduced_version: "5.3.8"
platform_version: "5.5.0"

workflow:
  runner: scripts/run_mandatory_qa.py
  prebuild_manifest_check: true
  ci_workflow: .github/workflows/mandatory-qa.yml
  cursor_hook: .cursor/hooks/mandatory-qa-gate.py
  agent_rule: .cursor/rules/05-nlap-mandatory-qa-gate.mdc

personas:
  - id: network_council
    name: Network Engineer Council
    questionnaire_sections: [A, B, C, H, I, J]
  - id: architect
    name: System Architect
    questionnaire_sections: [K, L, M, E]
  - id: software_engineer
    name: Software Engineer
    questionnaire_sections: [N, O, B]
  - id: field_operator
    name: Field Operator Team
    questionnaire_sections: [D, P, Q]
  - id: product_simplicity
    name: Product Simplicity (Steve Jobs lens)
    questionnaire_sections: [R, D]
  - id: ui_ux
    name: UI/UX Professional
    questionnaire_sections: [D, S, T]

lenses:
  - id: architect
    module: tests/mandatory/test_lens_architect.py
    scenarios:
      - id: MQA-arch-store-schema-001
        questionnaire_ids: [K-01, K-02]
        scenario: Investigation SQLite schema and evidence types exist
      - id: MQA-arch-json-safe-001
        questionnaire_ids: [K-06]
        scenario: API responses use sanitize_for_json
      - id: MQA-arch-output-paths-001
        questionnaire_ids: [E-07]
        scenario: Outputs use output_paths not CWD
      - id: MQA-arch-module-boundaries-001
        questionnaire_ids: [L-01, L-02]
        scenario: Web routes delegate to service modules
      - id: MQA-arch-job-separation-001
        questionnaire_ids: [K-07]
        scenario: Incident job vs acquisition job modules distinct
      - id: MQA-arch-time-sync-module-001
        questionnaire_ids: [K-08, P-12]
        scenario: Time sync analyzer module exists

  - id: software_engineer
    module: tests/mandatory/test_lens_software_engineer.py
    scenarios:
      - id: MQA-sw-route-errors-001
        questionnaire_ids: [N-01, N-02, N-03]
        scenario: Investigation routes return consistent error shapes
      - id: MQA-sw-store-finalize-001
        questionnaire_ids: [H-04, O-01]
        scenario: Acquisition finalize uses update_investigation_metadata
      - id: MQA-sw-workflow-context-001
        questionnaire_ids: [H-03]
        scenario: Workflow merges incident_story into context
      - id: MQA-sw-telemetry-dict-001
        questionnaire_ids: [D-07]
        scenario: Telemetry exposes error_count and warning_count
      - id: MQA-sw-command-audit-error-001
        questionnaire_ids: [A-07]
        scenario: Failed commands write audit events

  - id: field_operator
    module: tests/mandatory/test_lens_field_operator.py
    scenarios:
      - id: MQA-field-offline-paste-001
        questionnaire_ids: [P-01, B-06]
        scenario: Offline log analysis without SSH
      - id: MQA-field-autonomous-start-001
        questionnaire_ids: [P-02, B-01]
        scenario: Autonomous run start API exists
      - id: MQA-field-forensic-acquisition-001
        questionnaire_ids: [P-03, B-02]
        scenario: Forensic acquisition start and result APIs
      - id: MQA-field-audit-export-001
        questionnaire_ids: [P-06, A-08]
        scenario: Audit CSV export route
      - id: MQA-field-health-wizard-001
        questionnaire_ids: [P-09, D-05]
        scenario: Health check run endpoint
      - id: MQA-field-multi-device-001
        questionnaire_ids: [P-10, B-08]
        scenario: Additional devices in incident payload
      - id: MQA-field-time-sync-panel-001
        questionnaire_ids: [P-12, D-10]
        scenario: Time sync management panel in health wizard
      - id: MQA-field-time-sync-api-001
        questionnaire_ids: [P-12, L-05]
        scenario: Time sync analysis API endpoints
      - id: MQA-field-time-sync-analyzer-001
        questionnaire_ids: [P-12, K-08]
        scenario: Time sync analyzer module

  - id: product_simplicity
    module: tests/mandatory/test_lens_product_simplicity.py
    scenarios:
      - id: MQA-jobs-single-build-cta-001
        questionnaire_ids: [R-01]
        scenario: incidentStoryBuild is primary incident CTA
      - id: MQA-jobs-forensic-label-001
        questionnaire_ids: [R-02, B-02]
        scenario: Forensic checkbox distinct from auto-collect
      - id: MQA-jobs-progress-hide-001
        questionnaire_ids: [R-03]
        scenario: hideAcquisitionProgress function exists
      - id: MQA-jobs-release-notes-001
        questionnaire_ids: [R-06, Z-03]
        scenario: In-app release notes API

  - id: ui_ux
    module: tests/mandatory/test_lens_ui_ux.py
    scenarios:
      - id: MQA-ux-xss-escape-001
        questionnaire_ids: [S-04]
        scenario: sosEsc used in incident story render
      - id: MQA-ux-verdict-colors-001
        questionnaire_ids: [S-01]
        scenario: incidentVerdictColor helper exists
      - id: MQA-ux-acquisition-progress-001
        questionnaire_ids: [D-06, S-03]
        scenario: Acquisition progress bar and step indicators
      - id: MQA-ux-cancelled-state-001
        questionnaire_ids: [D-01]
