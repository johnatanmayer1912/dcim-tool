      - id: MQA-net-runbook-dedupe-001
        questionnaire_ids: [B-04, J-03]
        scenario: Runbook collect-next module
      - id: MQA-net-multi-device-001
        questionnaire_ids: [B-08]
        scenario: Multi-device correlation module
      - id: MQA-net-vendor-collectors-001
        questionnaire_ids: [C-01, C-02]
