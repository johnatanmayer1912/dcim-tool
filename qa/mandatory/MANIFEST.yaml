  - id: security
    module: tests/mandatory/test_lens_security.py
    scenarios:
      - id: MQA-sec-vault-unlock-001
        questionnaire_ids: [A-05]
        scenario: Vault unlock guard on credential get
      - id: MQA-sec-pcap-ssrf-001
