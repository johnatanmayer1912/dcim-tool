# Network Swiss Tool Pro — Mandatory QA Manifest
# Evolves with the product. Update on every feature, bugfix, or release prep.
# Validated by: scripts/validate_mandatory_qa_manifest.py
# Executed by: scripts/mandatory_release_qa.py (pre-release / on-change workflows)

version: 3
minimum_app_version: "7.4.33"
last_reviewed: "2026-10-11"

# When each suite runs (workflow triggers)
triggers:
  every_code_change:
    description: Agent or developer finished code edits — fast gate, no EXE build
    env_flag: NST_QA_ON_CHANGE
  pre_release:
    description: Before VERSION bump, CHANGELOG ship, or PyInstaller EXE
    env_flag: NST_QA_PRE_RELEASE
  post_feature:
    description: After new operator-facing capability lands
    env_flag: NST_QA_POST_FEATURE

# Persona owners — each must sign off mentally before ship
personas:
  network_engineer_council:
    skill: .cursor/skills/nst-network-engineer-council/SKILL.md
    deep: .cursor/skills/topology-map-excellence/SKILL.md
  product_architect:
    skill: .cursor/skills/nst-product-architect/SKILL.md
    deep: .cursor/skills/implementation-planner/SKILL.md
  software_engineer:
    skill: .cursor/skills/nst-python-backend/SKILL.md
    deep: .cursor/skills/safe-refactor-and-fix/SKILL.md
  noc_operator:
    skill: .cursor/skills/nst-network-operations/SKILL.md
    deep: .cursor/skills/product-ux-audit/SKILL.md
  product_simplicity:
    lens: "Steve Jobs / first principles — delete steps, one obvious path"
    skill: .cursor/skills/nst-product-architect/SKILL.md
    ally: .cursor/skills/nst-multi-advisor/SKILL.md
  ui_ux_professional:
    skill: .cursor/skills/product-ux-audit/SKILL.md
    rule: .cursor/rules/02-nst-ui-ux.mdc

# Mandatory suites — order matters within phase
suites:
  # ── Phase A: every code change ─────────────────────────────────────────────
  - id: syntax_and_prebuild
    phase: every_code_change
    owner: software_engineer
    command: [python, _prebuild.py]
    blocking: true

  - id: manifest_integrity
    phase: every_code_change
    owner: product_architect
    command: [python, scripts/validate_mandatory_qa_manifest.py]
    blocking: true

  # ── Phase B: pre-release core (implemented tests — always run) ───────────
