# Council questionnaire — code-only team validation (not pytest)
council:
  skill: .cursor/skills/nst-network-engineer-council/SKILL.md
  questionnaire: .cursor/skills/nst-network-engineer-council/QUESTIONNAIRE.md
  output_register: .cursor/audits/TEAM_VALIDATION_REGISTER_{date}.md
  required_before_major_release: true

# Evolution policy — agents MUST follow when changing product code
evolution_policy:
  doc: docs/09-qa/QA_EVOLUTION_POLICY.md
  rules:
    - "New feature → add ≥1 test in tests/qa/ + manifest entry + questionnaire row"
    - "Bug fix → add regression test (implemented) or scaffold with bug ID"
    - "Swiss Tools / runAction shortcut → tests/test_api_execute_mac_alias.py + tests/test_ui_execute_contract.py + EXECUTE_ACTION_CONTRACT.md"
    - "UI tab navigation → use goTo*Tab() helpers; no [data-tab=…] querySelector; verify tests/test_ui_execute_contract.py::TestNoDeadDataTabSelectors"
    - "New module → _prebuild.py syntax + .spec hiddenimports + manifest suite"
    - "UI change → tests/qa/test_06_ui_ux_clarity.py scenario + council H-lens row"
